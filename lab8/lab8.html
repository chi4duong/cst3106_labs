<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 8 - jQuery Dice Roller Animation</title>

  <style>
    :root{
      --color-primary:#1E3A8A;
      --color-bg:#F8FAFC;
      --color-surface:#FFFFFF;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background:var(--color-bg);
    }

    h1{
      margin-bottom:16px;
      color:var(--color-primary);
    }

    .wrapper{
      background:var(--color-surface);
      padding:24px 32px;
      border-radius:16px;
      box-shadow:0 10px 20px rgba(15,23,42,0.12);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }

    /* Dice tray with one die (could easily add more) */
    .dice-tray{
      display:flex;
      justify-content:center;
      gap:16px;
      margin-bottom:8px;
    }

    /* --- My die style (3×3 grid, pips controlled by .face-N) --- */
    .die{
      width:96px; height:96px;
      background:#fff;
      border-radius:20px;
      border:2px solid #e5e7eb;
      box-shadow:0 8px 18px rgba(0,0,0,.06) inset, 0 8px 20px rgba(15,23,42,0.15);
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding:12px;
      position:relative;
    }

    .pip{
      width:16px; height:16px;
      border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #444, #000);
      place-self:center;
      opacity:.95;
    }

    /* Grid cell positions (p-1..p-9 map to 3×3) */
    .p-1{ grid-area:1/1; } .p-2{ grid-area:1/2; } .p-3{ grid-area:1/3; }
    .p-4{ grid-area:2/1; } .p-5{ grid-area:2/2; } .p-6{ grid-area:2/3; }
    .p-7{ grid-area:3/1; } .p-8{ grid-area:3/2; } .p-9{ grid-area:3/3; }

    /* Hide all pips by default; faces below turn on some of them */
    .die .pip{ display:none; }

    /* Face mappings – like Yatzy CSS */
    .face-1 .p-5,
    .face-2 .p-1, .face-2 .p-9,
    .face-3 .p-1, .face-3 .p-5, .face-3 .p-9,
    .face-4 .p-1, .face-4 .p-3, .face-4 .p-7, .face-4 .p-9,
    .face-5 .p-1, .face-5 .p-3, .face-5 .p-5, .face-5 .p-7, .face-5 .p-9,
    .face-6 .p-1, .face-6 .p-3, .face-6 .p-4, .face-6 .p-6, .face-6 .p-7, .face-6 .p-9{
      display:block;
    }

    /* Roll button */
    #rollButton{
      padding:10px 18px;
      border-radius:999px;
      border:none;
      font-weight:600;
      cursor:pointer;
      background:var(--color-primary);
      color:white;
    }
    #rollButton:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      font-size:14px;
      color:#6b7280;
      min-height:1.2em;
    }

    /* Simple “rolling” animation – wiggle + scale */
    @keyframes roll-wobble {
      0%   { transform: translateY(0) rotate(0deg); }
      25%  { transform: translateY(-6px) rotate(10deg); }
      50%  { transform: translateY(0) rotate(-8deg); }
      75%  { transform: translateY(-4px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    .die.rolling{
      animation: roll-wobble 0.2s linear infinite;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>jQuery Dice Roller</h1>

    <div class="dice-tray">
      <!-- Start on face-6 so the die shows 6 dots initially -->
      <div class="die face-6" id="die1" aria-label="Die showing 6">
        <span class="pip p-1"></span>
        <span class="pip p-2"></span>
        <span class="pip p-3"></span>
        <span class="pip p-4"></span>
        <span class="pip p-5"></span>
        <span class="pip p-6"></span>
        <span class="pip p-7"></span>
        <span class="pip p-8"></span>
        <span class="pip p-9"></span>
      </div>
    </div>

    <button id="rollButton">Roll Dice</button>
    <div class="status" id="statusText">Click “Roll Dice” to start.</div>
  </div>

  <!-- jQuery CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    // Wait until the DOM is ready
    $(function () {

      const $die = $("#die1");
      const $button = $("#rollButton");
      const $status = $("#statusText");

      // Helper: remove old face-* class and apply the new one
      function setDieFace(value) {
        // Remove any existing face-X classes
        $die.removeClass(function (_i, classes) {
          // filter out classes that start with "face-"
          return (classes.match(/face-\d/g) || []).join(" ");
        });

        // Add the new face
        $die.addClass("face-" + value);
        $die.attr("aria-label", "Die showing " + value);
      }

      // When the button is clicked, trigger the rolling animation
      $button.on("click", function () {
        // Disable button during animation so user can't spam
        $button.prop("disabled", true);
        $status.text("Rolling...");

        // Add CSS animation class
        $die.addClass("rolling");

        // Quick fake “rolling” effect: change face several times
        let ticks = 0;
        const maxTicks = 10;           // how many quick changes
        const intervalMs = 80;         // speed of the rolling effect

        const intervalId = setInterval(function () {
          const tempValue = Math.floor(Math.random() * 6) + 1;
          setDieFace(tempValue);
          ticks++;

          if (ticks >= maxTicks) {
            clearInterval(intervalId);

            // Final random result between 1–6
            const finalValue = Math.floor(Math.random() * 6) + 1;
            setDieFace(finalValue);

            // Stop animation and re-enable button
            $die.removeClass("rolling");
            $button.prop("disabled", false);
            $status.text("Final value: " + finalValue);
          }
        }, intervalMs);
      });

    });
  </script>
</body>
</html>
